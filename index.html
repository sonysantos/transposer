<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Transposer — Transpositor de Cifras</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: sans-serif;
    max-width: 60em;
    margin: 2em auto;
    padding: 0 1em;
    color: #222;
  }
  h1 { font-size: 1.4em; }
  .controles { display: flex; flex-wrap: wrap; gap: 1em 2em; margin-bottom: 1.5em; }
  .campo { display: flex; flex-direction: column; gap: .3em; }
  .campo label { font-weight: 600; font-size: .9em; }
  select, input[type="number"] {
    padding: .4em .5em;
    font-size: 1em;
    border: 1px solid #ccc;
    border-radius: 4px;
  }
  input[type="number"] { width: 6em; }
  .caixas { display: grid; grid-template-columns: 1fr 1fr; gap: 1em; }
  @media (max-width: 700px) { .caixas { grid-template-columns: 1fr; } }
  .caixa { display: flex; flex-direction: column; gap: .3em; }
  .caixa label { font-weight: 600; font-size: .9em; }
  textarea {
    width: 100%;
    min-height: 14em;
    resize: vertical;
    padding: .6em;
    border: 1px solid #ccc;
    border-radius: 4px;
    font-size: 1em;
    line-height: 1.6;
    font-family: monospace;
  }
  #cifra_final { background: #f7f7f7; }
</style>
</head>
<body>
  <h1>Transposer</h1>

  <div class="controles">
    <div class="campo">
      <label for="tom_atual">Tom atual</label>
      <select id="tom_atual"></select>
    </div>
    <div class="campo">
      <label for="tom_desejado">Tom desejado</label>
      <select id="tom_desejado"></select>
    </div>
    <div class="campo">
      <label for="tamanho_acidente">Tamanho do acidente (espaços)</label>
      <input type="number" id="tamanho_acidente" min="0" step="1" value="1">
    </div>
    <div class="campo">
      <label for="fonte">Fonte das cifras</label>
      <select id="fonte">
        <option value="monospace" selected>Monospaced</option>
        <option value="sans-serif">Sans-serif</option>
        <option value="serif">Serif</option>
      </select>
    </div>
  </div>

  <div class="caixas">
    <div class="caixa">
      <label for="cifra_original">Cifra no tom original</label>
      <textarea id="cifra_original" spellcheck="false">C  G  Am  Em  F  C
C7  B7  Bb  G7</textarea>
    </div>
    <div class="caixa">
      <label for="cifra_final">Cifra transposta</label>
      <textarea id="cifra_final" readonly spellcheck="false"></textarea>
    </div>
  </div>

<script>
'use strict';

var NOTAS = ['C', 'D', 'E', 'F', 'G', 'A', 'B'];
var PITCH = { C: 0, D: 2, E: 4, F: 5, G: 7, A: 9, B: 11 };
var NATURAL = [0, 2, 4, 5, 7, 9, 11];
var TECLAS = ['C', 'C#', 'Db', 'D', 'D#', 'Eb', 'E', 'F', 'F#', 'Gb', 'G', 'G#', 'Ab', 'A', 'A#', 'Bb', 'B'];

function semitom(nome) {
  var p = PITCH[nome[0]];
  if (nome[1] === '#') p += 1;
  else if (nome[1] === 'b') p -= 1;
  return (p + 12) % 12;
}

function tipoAcidente(tom) {
  if (tom.indexOf('#') !== -1) return '#';
  if (tom.indexOf('b') !== -1) return 'b';
  return tom === 'F' ? 'b' : '#';
}

function escreverNota(pc, tipo) {
  var i = NATURAL.indexOf(pc);
  if (i !== -1) return NOTAS[i];
  if (tipo === 'b') {
    return NOTAS[NATURAL.indexOf((pc + 1) % 12)] + 'b';
  }
  return NOTAS[NATURAL.indexOf((pc - 1 + 12) % 12)] + '#';
}

function transporNota(nota, intervalo, tipo) {
  var pc = (semitom(nota) + intervalo + 12) % 12;
  return escreverNota(pc, tipo);
}

function transposar() {
  var tomAtual = document.getElementById('tom_atual').value;
  var tomDesejado = document.getElementById('tom_desejado').value;
  var texto = document.getElementById('cifra_original').value.replace(/\r\n/g, '\n');

  var tamanho = parseInt(document.getElementById('tamanho_acidente').value, 10);
  if (isNaN(tamanho)) tamanho = 1;
  if (tamanho < 0) tamanho = 0;

  var intervalo = (semitom(tomDesejado) - semitom(tomAtual) + 12) % 12;
  var tipo = tipoAcidente(tomDesejado);

  var re = /\b(?<nota>[A-G][#b]?)(°|dim|m?(\d[\+M]?)?)(?=(\/|\)| |$|\n))/g;
  var saida = '';
  var ultimo = 0;
  var skipDir = 0;
  var m;

  while ((m = re.exec(texto)) !== null) {
    var inicio = m.index;
    var fim = m.index + m[0].length;
    var nota = m.groups.nota;
    var sufixo = m[0].slice(nota.length);
    var novaNota = transporNota(nota, intervalo, tipo);

    var inicioLinha = texto.lastIndexOf('\n', inicio - 1) + 1;
    var fimLinha = texto.indexOf('\n', fim);
    if (fimLinha === -1) fimLinha = texto.length;

    var esquerda = texto.slice(inicioLinha, inicio);
    var direita = texto.slice(fim, fimLinha);
    var espacosEsq = esquerda.length - esquerda.replace(/ +$/, '').length;
    var espacosDir = direita.length - direita.replace(/^ +/, '').length;
    var noInicioLinha = inicio === inicioLinha;
    var noFimLinha = fim === fimLinha;

    var segmento = texto.slice(ultimo, inicio);
    if (skipDir > 0) {
      segmento = segmento.slice(skipDir);
      skipDir = 0;
    }

    var comAcidente = nota.length === 2;
    var novaComAcidente = novaNota.length === 2;
    var acorde = novaNota + sufixo;

    if (comAcidente && !novaComAcidente) {
      var e = Math.floor(tamanho / 2);
      var d = Math.ceil(tamanho / 2);
      segmento += ' '.repeat(e);
      acorde += ' '.repeat(d);
    } else if (!comAcidente && novaComAcidente) {
      var alvoEsq, alvoDir;
      if (noInicioLinha) { alvoEsq = 0; alvoDir = tamanho; }
      else if (noFimLinha) { alvoEsq = tamanho; alvoDir = 0; }
      else { alvoEsq = Math.floor(tamanho / 2); alvoDir = Math.ceil(tamanho / 2); }
      var remEsq = Math.min(alvoEsq, espacosEsq);
      var remDir = Math.min(alvoDir, espacosDir);
      if (remEsq > 0) segmento = segmento.slice(0, segmento.length - remEsq);
      skipDir = remDir;
    }

    saida += segmento + acorde;
    ultimo = fim;
  }

  var restante = texto.slice(ultimo);
  if (skipDir > 0) restante = restante.slice(skipDir);
  saida += restante;

  document.getElementById('cifra_final').value = saida;
}

function preencherTons() {
  var opcoes = TECLAS.map(function (t) {
    return '<option value="' + t + '">' + t + '</option>';
  }).join('');
  document.getElementById('tom_atual').innerHTML = opcoes;
  document.getElementById('tom_desejado').innerHTML = opcoes;
  document.getElementById('tom_atual').value = 'C';
  document.getElementById('tom_desejado').value = 'G';
}

function aplicarFonte() {
  var f = document.getElementById('fonte').value;
  document.getElementById('cifra_original').style.fontFamily = f;
  document.getElementById('cifra_final').style.fontFamily = f;
}

function ligarEventos() {
  var ids = ['tom_atual', 'tom_desejado', 'cifra_original'];
  ids.forEach(function (id) {
    document.getElementById(id).addEventListener('input', transposar);
    document.getElementById(id).addEventListener('change', transposar);
  });
  document.getElementById('tamanho_acidente').addEventListener('input', transposar);
  document.getElementById('fonte').addEventListener('change', aplicarFonte);
}

preencherTons();
aplicarFonte();
ligarEventos();
transposar();
</script>
</body>
</html>
